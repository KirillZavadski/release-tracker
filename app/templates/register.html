<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Tracker — Регистрация</title>
    <style>
        :root {
            --bg-color: #f7f6f2;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --accent-color: #8da47e;
            --accent-hover: #79906b;
            --border-color: #e3e0db;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #3d3d3d;
            letter-spacing: -0.5px;
        }

        /* Карточка с закругленными углами */
        .card {
            background-color: var(--card-bg);
            width: 100%;
            padding: 30px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Поля ввода */
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #faf9f6;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
            background-color: #fff;
        }

        /* Чекбокс Remember me */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #666;
            cursor: pointer;
            user-select: none;
            margin-top: 4px;
        }

        .checkbox-label input {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Кнопка Start */
        .start-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
        }

        .start-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Блок с сообщением об ошибке / flash */
        .error-msg {
            color: #d9534f;
            font-size: 0.85rem;
            text-align: center;
            background-color: #fdf2f2;
            border: 1px solid #f5c6cb;
            padding: 8px 12px;
            border-radius: 6px;
        }

        /* Ссылка на вход под карточкой */
        .login-container {
            margin-top: 24px;
            text-align: center;
            font-size: 0.95rem;
            color: #666;
            line-height: 1.4;
        }

        .login-container a {
            color: var(--accent-hover);
            text-decoration: none;
            font-weight: 500;
        }

        .login-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Release Tracker</h1>

        <div class="card">
            <form id="registerForm" action="/register" method="POST">
                <div class="input-group">
                    <input type="text" name="username" id="username" placeholder="New Login" required autocomplete="username">
                </div>
                
                <div class="input-group" style="margin-top: 14px;">
                    <input type="password" name="password" id="password" placeholder="Pass (min: 6 symbols)" required minlength="6" autocomplete="new-password">
                </div>
                
                <div style="margin-top: 12px;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                </div>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="error-msg" style="margin-top: 14px;">{{ messages[0] }}</div>
                    {% endif %}
                {% endwith %}

                <button type="submit" class="start-btn" style="margin-top: 16px;">Start</button>
            </form>
        </div>

        <div class="login-container">
            Already have one?<br>
            <a href="/login">Log in</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            const password = document.getElementById('password').value;
            if (password.length < 6) {
                e.preventDefault();
                alert('Пароль должен содержать не менее 6 символов');
            }
        });
    </script>
</body>
</html>
