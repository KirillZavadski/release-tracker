<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Tracker — Releases</title>
    <style>
        :root {
            --bg-color: #f7f6f2;        /* Pastel cream background */
            --card-bg: #ffffff;         /* White card background */
            --text-color: #4a4a4a;      /* Soft dark-grey text */
            --accent-color: #8da47e;    /* Pastel olive-green */
            --accent-hover: #79906b;    /* Hover state for accent */
            --border-color: #e3e0db;    /* Border color */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            box-sizing: border-box;
        }

        /* Top navigation panel */
        .top-nav {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 18px;
        }

        /* Back button */
        .back-btn {
            background-color: #eeebe3;
            color: var(--text-color);
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .back-btn:hover {
            background-color: #e3e0db;
        }

        /* Title in the center */
        .app-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #3d3d3d;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* Button + New Release */
        .new-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .new-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Deadline alert banner */
        .deadline-alert {
            display: none;
            background-color: #fff4e5;
            border: 1px solid #f0ad4e;
            color: #7c4a03;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 18px;
            font-size: 0.92rem;
            line-height: 1.45;
        }

        /* Releases list container */
        .releases-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        /* Release card */
        .release-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 18px 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .release-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }

        .release-info h4 {
            margin: 0 0 6px 0;
            font-size: 1.1rem;
            color: #3d3d3d;
        }

        .release-info p {
            margin: 4px 0;
            font-size: 0.9rem;
            color: #666;
        }

        .release-deadline {
            font-size: 0.88rem !important;
            color: #555 !important;
        }

        .release-deadline.reached {
            color: #a15200 !important;
            font-weight: 600;
        }

        .release-time {
            font-size: 0.8rem !important;
            color: #999 !important;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            background-color: #f0f4ed;
            color: var(--accent-hover);
        }

        .status-badge.status-testing {
            background-color: #fff4e5;
            color: #9c5700;
        }

        .status-badge.status-deployed {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .status-badge.status-deprecated {
            background-color: #f1f1f1;
            color: #666666;
        }

        .card-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .status-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.2s, border-color 0.2s;
        }

        .status-btn:hover {
            background-color: #f5f3ef;
            border-color: #d1cfc7;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background-color: #fdf2f2;
        }

        /* Modal window */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
            z-index: 1000;
        }

        .modal {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .modal h3 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #3d3d3d;
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
        }

        .modal input,
        .modal select {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #faf9f6;
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
        }

        .modal input:focus,
        .modal select:focus {
            border-color: var(--accent-color);
            background-color: #fff;
        }

        .deadline-group {
            display: none;
            margin-bottom: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background-color: #eeebe3;
            color: var(--text-color);
        }

        .btn-cancel:hover {
            background-color: #e3e0db;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .empty-state {
            text-align: center;
            color: #888;
            padding: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Top navigation panel -->
        <div class="top-nav">
            <a href="/" class="back-btn">← Back</a>
            <h1 class="app-title">Releases</h1>
            <button class="new-btn" onclick="openCreateModal()">+ New Release</button>
        </div>

        <!-- Deadline warning banner -->
        <div class="deadline-alert" id="deadlineAlert"></div>

        <!-- Releases list -->
        <div class="releases-list" id="releasesList">
            <div class="empty-state">Loading releases...</div>
        </div>
    </div>

    <!-- Create Release Modal -->
    <div class="modal-overlay" id="createModalOverlay">
        <div class="modal">
            <h3>New Release</h3>
            <label class="field-label" for="releaseVersion">Version</label>
            <input type="text" id="releaseVersion" placeholder="Version (e.g. v1.0.0)">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeCreateModal()">Cancel</button>
                <button class="btn-submit" onclick="createRelease()">Create</button>
            </div>
        </div>
    </div>

    <!-- Change Status Modal -->
    <div class="modal-overlay" id="statusModalOverlay">
        <div class="modal">
            <h3>Change Status</h3>
            <label class="field-label" for="newStatusSelect">Status</label>
            <select id="newStatusSelect" onchange="toggleDeadlineField()">
                <option value="DRAFT">DRAFT</option>
                <option value="TESTING">TESTING</option>
                <option value="DEPLOYED">DEPLOYED</option>
                <option value="DEPRECATED">DEPRECATED</option>
            </select>

            <div class="deadline-group" id="deadlineGroup">
                <label class="field-label" for="deadlineInput">Deadline (date and time)</label>
                <input type="datetime-local" id="deadlineInput">
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeStatusModal()">Cancel</button>
                <button class="btn-submit" onclick="saveNewStatus()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        const SERVICE_ID = {{ service_id }};
        const IS_ADMIN = {{ 'true' if is_admin|default(false) else 'false' }};

        let currentEditingReleaseId = null;
        let releasesCache = [];

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function isDeadlineReached(release) {
            const status = String(release.status || '').toUpperCase();
            if (status !== 'TESTING') return false;

            if (typeof release.deadline_reached === 'boolean') {
                return release.deadline_reached;
            }
            if (!release.deadline_iso) return false;

            const deadlineDate = new Date(release.deadline_iso);
            return !Number.isNaN(deadlineDate.getTime()) && new Date() >= deadlineDate;
        }

        function renderDeadlineBanner(releases) {
            const alertEl = document.getElementById('deadlineAlert');
            const reachedList = releases.filter(isDeadlineReached);

            if (reachedList.length === 0) {
                alertEl.style.display = 'none';
                alertEl.textContent = '';
                return;
            }

            const itemsText = reachedList
                .map(r => `${r.version || 'Unknown'}${r.deadline ? ` (${r.deadline})` : ''}`)
                .join(', ');

            alertEl.textContent = `Внимание: подошёл дедлайн тестирования по релизу(-ам) сервиса: ${itemsText}.`;
            alertEl.style.display = 'block';
        }

        function formatDateTimeRu(dateObj) {
            const pad = n => String(n).padStart(2, '0');
            return `${pad(dateObj.getDate())}.${pad(dateObj.getMonth() + 1)}.${dateObj.getFullYear()} ${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`;
        }

        function datetimeLocalToRuString(localValue) {
            if (!localValue) return '';
            const [datePart, timePart] = localValue.split('T');
            if (!datePart || !timePart) return localValue;
            const [year, month, day] = datePart.split('-');
            const timeClean = timePart.slice(0, 5);
            return `${day}.${month}.${year} ${timeClean}`;
        }

        async function loadReleases() {
            try {
                const response = await fetch(`${API_URL}/services/${SERVICE_ID}/releases`);
                const releases = await response.json();
                releasesCache = Array.isArray(releases) ? releases : [];

                renderDeadlineBanner(releasesCache);

                const listElement = document.getElementById('releasesList');
                listElement.innerHTML = '';

                if (releasesCache.length === 0) {
                    listElement.innerHTML = '<div class="empty-state">No releases yet for this service. Click «+ New Release» to add one.</div>';
                    return;
                }

                releasesCache.forEach(release => {
                    const statusUpper = String(release.status || 'DRAFT').toUpperCase();
                    const statusCssClass = `status-${statusUpper.toLowerCase()}`;
                    const reached = isDeadlineReached(release);

                    const formattedCreated = release.created_at
                        ? new Date(release.created_at).toLocaleString()
                        : 'N/A';

                    let deadlineHtml = '';
                    if (statusUpper === 'TESTING' && release.deadline) {
                        deadlineHtml = `<p class="release-deadline ${reached ? 'reached' : ''}">Deadline: ${escapeHtml(release.deadline)}${reached ? ' — дедлайн наступил' : ''}</p>`;
                    }

                    const statusActionHtml = IS_ADMIN
                        ? `<button class="status-btn" onclick="openStatusModal(${release.id})">Change Status</button>`
                        : '';

                    listElement.innerHTML += `
                        <div class="release-card">
                            <div class="release-info">
                                <h4>Version: ${escapeHtml(release.version || 'Unknown')}</h4>
                                <p>Status: <span class="status-badge ${statusCssClass}">${escapeHtml(statusUpper)}</span></p>
                                ${deadlineHtml}
                                <p class="release-time">Created: ${escapeHtml(formattedCreated)}</p>
                            </div>
                            <div class="card-footer">
                                ${statusActionHtml}
                                <button class="delete-btn" onclick="deleteRelease(${release.id})">Delete</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading releases:', error);
                document.getElementById('releasesList').innerHTML = '<div class="empty-state" style="color: #d9534f;">Backend connection error</div>';
            }
        }

        function openCreateModal() {
            document.getElementById('createModalOverlay').style.display = 'flex';
        }

        function closeCreateModal() {
            document.getElementById('createModalOverlay').style.display = 'none';
            document.getElementById('releaseVersion').value = '';
        }

        function toggleDeadlineField() {
            const selectedStatus = document.getElementById('newStatusSelect').value;
            const deadlineGroup = document.getElementById('deadlineGroup');
            const deadlineInput = document.getElementById('deadlineInput');

            if (selectedStatus === 'TESTING') {
                deadlineGroup.style.display = 'block';
                deadlineInput.required = true;
            } else {
                deadlineGroup.style.display = 'none';
                deadlineInput.required = false;
                deadlineInput.value = '';
            }
        }

        function openStatusModal(releaseId) {
            if (!IS_ADMIN) {
                alert('Только администратор может менять статус релиза.');
                return;
            }

            const release = releasesCache.find(r => r.id === releaseId);
            if (!release) return;

            currentEditingReleaseId = releaseId;
            const currentStatus = String(release.status || 'DRAFT').toUpperCase();
            const selectEl = document.getElementById('newStatusSelect');
            const deadlineInput = document.getElementById('deadlineInput');

            selectEl.value = ['DRAFT', 'TESTING', 'DEPLOYED', 'DEPRECATED'].includes(currentStatus)
                ? currentStatus
                : 'DRAFT';

            deadlineInput.value = release.deadline_iso ? release.deadline_iso.slice(0, 16) : '';
            toggleDeadlineField();

            document.getElementById('statusModalOverlay').style.display = 'flex';
        }

        function closeStatusModal() {
            document.getElementById('statusModalOverlay').style.display = 'none';
            currentEditingReleaseId = null;
            document.getElementById('deadlineInput').value = '';
        }

        async function createRelease() {
            const version = document.getElementById('releaseVersion').value.trim();

            if (!version) {
                alert('Please enter a version!');
                return;
            }

            const payload = {
                service_id: SERVICE_ID,
                version
            };

            try {
                const response = await fetch(`${API_URL}/releases`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    closeCreateModal();
                    loadReleases();
                } else {
                    const err = await response.json();
                    alert('Error: ' + (err.error || 'Failed to create release'));
                }
            } catch (error) {
                console.error('Error creating release:', error);
            }
        }

        async function saveNewStatus() {
            if (!IS_ADMIN) {
                alert('Только администратор может менять статус релиза.');
                return;
            }

            const status = document.getElementById('newStatusSelect').value;
            const localDeadline = document.getElementById('deadlineInput').value;

            if (!status || !currentEditingReleaseId) return;

            const payload = { status };

            if (status === 'TESTING') {
                if (!localDeadline) {
                    alert('Для перевода в тестовый статус обязательно укажите дату и время дедлайна.');
                    return;
                }
                payload.deadline = datetimeLocalToRuString(localDeadline);
            } else {
                payload.deadline = null;
            }

            try {
                const response = await fetch(`${API_URL}/releases/${currentEditingReleaseId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    closeStatusModal();
                    loadReleases();
                } else {
                    const err = await response.json();
                    alert('Error: ' + (err.error || 'Failed to update status'));
                }
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        async function deleteRelease(releaseId) {
            if (!confirm('Delete this release?')) return;

            try {
                const response = await fetch(`${API_URL}/releases/${releaseId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadReleases();
                } else {
                    alert('Failed to delete release');
                }
            } catch (error) {
                console.error('Error deleting release:', error);
            }
        }

        loadReleases();
    </script>
</body>
</html>
