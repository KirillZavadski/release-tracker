<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Tracker — Releases</title>
    <style>
        :root {
            --bg-color: #f7f6f2;        /* Pastel cream background */
            --card-bg: #ffffff;         /* White card background */
            --text-color: #4a4a4a;      /* Soft dark-grey text */
            --accent-color: #8da47e;    /* Pastel olive-green */
            --accent-hover: #79906b;    /* Hover state for accent */
            --border-color: #e3e0db;    /* Border color */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            box-sizing: border-box;
        }

        /* Top navigation panel */
        .top-nav {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
        }

        /* Back button */
        .back-btn {
            background-color: #eeebe3;
            color: var(--text-color);
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .back-btn:hover {
            background-color: #e3e0db;
        }

        /* Title in the center */
        .app-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #3d3d3d;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* Button + New Release */
        .new-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .new-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Releases list container */
        .releases-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        /* Release card */
        .release-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 18px 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .release-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }

        .release-info h4 {
            margin: 0 0 6px 0;
            font-size: 1.1rem;
            color: #3d3d3d;
        }

        .release-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #777;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background-color: #fdf2f2;
        }

        /* Modal window */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .modal {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .modal h3 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #3d3d3d;
            margin-bottom: 16px;
        }

        .modal input {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #faf9f6;
            box-sizing: border-box;
            outline: none;
        }

        .modal input:focus {
            border-color: var(--accent-color);
            background-color: #fff;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background-color: #eeebe3;
            color: var(--text-color);
        }

        .btn-cancel:hover {
            background-color: #e3e0db;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .empty-state {
            text-align: center;
            color: #888;
            padding: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Top navigation panel -->
        <div class="top-nav">
            <a href="/" class="back-btn">← Back</a>
            <h1 class="app-title" id="pageTitle">Releases</h1>
            <button class="new-btn" onclick="openModal()">+ New Release</button>
        </div>

        <!-- Releases list -->
        <div class="releases-list" id="releasesList">
            <div class="empty-state">Loading releases...</div>
        </div>
    </div>

    <!-- Modal window for creating a release -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>New Release</h3>
            <input type="text" id="releaseVersion" placeholder="Version (e.g. v1.0.0)">
            <input type="text" id="releaseDescription" placeholder="Description / Tag">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-submit" onclick="createRelease()">Create</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3030/api';
        const SERVICE_ID = { service_id }; // Injected from Flask route

        async function loadReleases() {
            try {
                const response = await fetch(`${API_URL}/services/${SERVICE_ID}/releases`);
                const releases = await response.json();
                
                const listElement = document.getElementById('releasesList');
                listElement.innerHTML = '';

                if (!releases || releases.length === 0) {
                    listElement.innerHTML = '<div class="empty-state">No releases yet for this service. Click «+ New Release» to add one.</div>';
                    return;
                }

                releases.forEach(release => {
                    listElement.innerHTML += `
                        <div class="release-card">
                            <div class="release-info">
                                <h4>${release.version || release.tag || 'Release #' + release.id}</h4>
                                <p>${release.description || release.repository_url || 'No description'}</p>
                            </div>
                            <button class="delete-btn" onclick="deleteRelease(${release.id})">Delete</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading releases:', error);
                document.getElementById('releasesList').innerHTML = '<div class="empty-state" style="color: #d9534f;">Backend connection error</div>';
            }
        }

        function openModal() {
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('releaseVersion').value = '';
            document.getElementById('releaseDescription').value = '';
        }

        async function createRelease() {
            const versionInput = document.getElementById('releaseVersion');
            const descInput = document.getElementById('releaseDescription');

            const version = versionInput.value.trim();
            const description = descInput.value.trim();

            if (!version) {
                alert('Please enter a version!');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/services/${SERVICE_ID}/releases`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ version, description })
                });

                if (response.ok) {
                    closeModal();
                    loadReleases();
                } else {
                    const err = await response.json();
                    alert('Error: ' + (err.error || 'Failed to create release'));
                }
            } catch (error) {
                console.error('Error creating release:', error);
            }
        }

        async function deleteRelease(releaseId) {
            if (!confirm('Delete this release?')) return;

            try {
                const response = await fetch(`${API_URL}/releases/${releaseId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadReleases();
                } else {
                    alert('Failed to delete release');
                }
            } catch (error) {
                console.error('Error deleting release:', error);
            }
        }

        // Load releases on page open
        loadReleases();
    </script>
</body>
</html>
