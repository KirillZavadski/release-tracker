<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Tracker — Profile</title>
    <style>
        :root {
            --bg-color: #f7f6f2;        /* Pastel cream background */
            --card-bg: #ffffff;         /* White card background */
            --text-color: #4a4a4a;      /* Soft dark-grey text */
            --accent-color: #8da47e;    /* Pastel olive-green */
            --accent-hover: #79906b;    /* Hover state for accent */
            --border-color: #e3e0db;    /* Border color */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            box-sizing: border-box;
        }

        /* Top navigation panel */
        .top-nav {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
        }

        .back-btn {
            background-color: #eeebe3;
            color: var(--text-color);
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .back-btn:hover {
            background-color: #e3e0db;
        }

        .app-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #3d3d3d;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .nav-right-placeholder {
            width: 76px;
        }

        /* Profile card container */
        .profile-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 500px;
            margin: 0 auto 24px auto;
            box-sizing: border-box;
        }

        .profile-row {
            margin-bottom: 20px;
        }

        .profile-row label {
            font-size: 0.85rem;
            color: #888;
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-row .value {
            font-size: 1.1rem;
            color: #3d3d3d;
            font-weight: 500;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-admin {
            background-color: #fdf2f2;
            color: #d9534f;
            border: 1px solid #f9d6d5;
        }

        .badge-user {
            background-color: #f2f5f0;
            color: var(--accent-hover);
            border: 1px solid #dbe5d5;
        }

        /* Logout button */
        .logout-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background-color: #c9302c;
        }

        /* Admin users management section */
        .admin-section {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .admin-section h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #3d3d3d;
            margin-bottom: 16px;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background-color: #faf9f6;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .delete-user-btn {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .delete-user-btn:hover {
            background-color: #fdf2f2;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Top navigation panel -->
        <div class="top-nav">
            <a href="/" class="back-btn">← Back</a>
            <h1 class="app-title">Profile</h1>
            <div class="nav-right-placeholder"></div>
        </div>

        <!-- Profile Card -->
        <div class="profile-card">
            <div class="profile-row">
                <label>Username</label>
                <div class="value">{{ user.username }}</div>
            </div>

            <div class="profile-row" style="margin-bottom: 30px;">
                <label>Role</label>
                <div class="value">
                    {% if user.is_admin %}
                        <span class="badge badge-admin">Administrator</span>
                    {% else %}
                        <span class="badge badge-user">Standard User</span>
                    {% endif %}
                </div>
            </div>

            <form action="{{ url_for('pages.logout') }}" method="POST">
                <button type="submit" class="logout-btn">Log out</button>
            </form>
        </div>

        <!-- Admin Panel: Users Management (displayed only if user is admin) -->
        {% if user.is_admin %}
        <div class="admin-section" style="margin-top: 24px;">
            <h3>User Management</h3>
            <div class="user-list" id="usersListContainer">
                <div style="color: #888; font-size: 0.9rem;">Loading users...</div>
            </div>
        </div>
        {% endif %}
    </div>

    <script>
        {% if user.is_admin %}
        async function loadAllUsers() {
            try {
                const response = await fetch('/users');
                if (!response.ok) throw new Error('Failed to load users');
                
                const users = await response.json();
                const container = document.getElementById('usersListContainer');
                container.innerHTML = '';

                if (!users || users.length === 0) {
                    container.innerHTML = '<div style="color: #888; font-size: 0.9rem;">No users found.</div>';
                    return;
                }

                users.forEach(u => {
                    // Не показываем кнопку удаления для текущего залогиненного админа
                    const isCurrent = u.id === {{ user.id }};
                    
                    container.innerHTML += `
                        <div class="user-item">
                            <span><strong>${u.username}</strong> ${isCurrent ? '(You)' : ''}</span>
                            ${!isCurrent ? `<button class="delete-user-btn" onclick="deleteUser(${u.id}, '${u.username}')">Delete</button>` : ''}
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('usersListContainer').innerHTML = '<div style="color: #d9534f; font-size: 0.9rem;">Failed to load users</div>';
            }
        }

        async function deleteUser(userId, username) {
            if (!confirm(`Are you sure you want to delete user "${username}" and all their services?`)) return;

            try {
                const response = await fetch(`/users/${userId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadAllUsers(); // Перезагружаем список
                } else {
                    const err = await response.json();
                    alert('Error: ' + (err.error || 'Failed to delete user'));
                }
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('Network error while deleting user');
            }
        }

        loadAllUsers();
        {% endif %}
    </script>
</body>
</html>
